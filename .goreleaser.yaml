version: 2

project_name: docker-tui

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: docker-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
